name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package.json
            client/package.json
      - name: Install server
        run: npm install --prefix server
      - name: Install client
        run: npm install --prefix client --include=optional
      - name: Lint
        run: npm run lint --prefix server && npm run lint --prefix client
      - name: Test server
        run: npm run test --prefix server
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-16-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-16-chars
          DOCUMENT_ENCRYPTION_SECRET: test-doc-enc-secret-minimum-16-chars
      - name: Test client
        run: npm run test --prefix client -- --passWithNoTests
      - name: Build frontend
        run: npm run build --prefix client

