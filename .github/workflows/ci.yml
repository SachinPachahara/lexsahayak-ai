name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server
        working-directory: ./server
        run: npm install
      - name: Install client
        working-directory: ./client
        run: npm install --include=optional
      - name: Lint server
        working-directory: ./server
        run: npm run lint
      - name: Lint client
        working-directory: ./client
        run: npm run lint
      - name: Test server
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-16-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-16-chars
          DOCUMENT_ENCRYPTION_SECRET: test-doc-enc-secret-minimum-16-chars
      - name: Test client
        working-directory: ./client
        run: npm test || true
      - name: Build frontend
        working-directory: ./client
        run: npm run build

